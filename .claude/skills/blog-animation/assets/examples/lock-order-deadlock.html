<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>락 순서 데드락</title>
<style>
  :root {
    --page: #ffffff; --bg: #fafafa; --surface: #ffffff;
    --hair: #ebebeb; --hair-strong: #a1a1a1;
    --ink: #171717; --ink-body: #4d4d4d; --mute: #707070;
    --a: #0057c2; --a-soft: #d3e5ff;
    --b: #945800; --b-soft: #fdebc8;
    --err: #c00000; --err-soft: #ffe1e1;
    --ok: #0b6b4b; --ok-soft: #d6f5ea;
  }
  :root[data-theme="dark"] {
    --page: #0a0a0a; --bg: #121212; --surface: #1a1a1a;
    --hair: #2e2e2e; --hair-strong: #454545;
    --ink: #ededed; --ink-body: #b0b0b0; --mute: #8f8f8f;
    --a: #3291ff; --a-soft: #10233f;
    --b: #f7b955; --b-soft: #3a2a0e;
    --err: #ff6166; --err-soft: #3d1416;
    --ok: #50e3c2; --ok-soft: #0f2e27;
  }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body {
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: 16px;
  }
  .stage { max-width: 760px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
  .mono { font-family: "JetBrains Mono", "D2Coding", ui-monospace, SFMono-Regular, Menlo, monospace; }
  .controls { display: flex; gap: 12px; align-items: center; margin-top: 12px; font-size: 14px; color: var(--ink-body); }
  .controls input[type=range] { flex: 1; }
  .controls button, .controls select { font: inherit; padding: 4px 10px; }
  body.capture { padding: 0; }
  body.capture .controls { display: none; }
</style>
</head>
<body>
<div class="stage">
  <svg id="scene" viewBox="0 0 760 400" role="img"
       aria-label="트랜잭션 A와 B가 user 1~10을 서로 다른 랜덤 순서로 잠그다가, A는 B가 쥔 user 9를, B는 A가 쥔 user 3을 기다리며 데드락이 난다. InnoDB가 B를 롤백하고 A가 커밋한다."></svg>
  <div class="controls">
    <button id="play" type="button">일시정지</button>
    <input id="scrub" type="range" min="0" step="0.01">
    <span id="clock" class="mono">0.0s</span>
    <select id="theme"><option value="light">라이트</option><option value="dark">다크</option></select>
  </div>
</div>
<script>
(function () {
  // 두 트랜잭션이 잠그려는 user id 순서. 둘 다 1~10 전부지만 순서가 다르다.
  var ORDER = {
    A: [3, 7, 1, 9, 5, 2, 10, 4, 8, 6],
    B: [8, 2, 9, 3, 6, 10, 1, 5, 7, 4]
  };

  function lock(who) {
    return function (s) {
      var id = ORDER[who][s[who].done];
      s.locks[id] = who;
      s[who].done++;
      s[who].wait = null;
      s.fresh = { kind: 'lock', who: who, id: id };
    };
  }
  function wait(who) {
    return function (s) {
      var id = ORDER[who][s[who].done];
      s[who].wait = id;
      s[who].status = '대기 중';
      s.fresh = { kind: 'wait', who: who, id: id };
    };
  }

  var STEPS = [
    { d: 1.8, cap: 'A와 B 모두 user 1~10을 잠근다 — 순서는 각자 랜덤', fn: function () {} },
    { d: 0.7, cap: 'A: user 3 잠금', fn: lock('A') },
    { d: 0.7, cap: 'B: user 8 잠금', fn: lock('B') },
    { d: 0.7, cap: 'A: user 7 잠금', fn: lock('A') },
    { d: 0.7, cap: 'B: user 2 잠금', fn: lock('B') },
    { d: 0.7, cap: 'A: user 1 잠금', fn: lock('A') },
    { d: 0.7, cap: 'B: user 9 잠금', fn: lock('B') },
    { d: 1.6, cap: 'A: user 9 요청 → B가 쥐고 있어 대기', fn: wait('A') },
    { d: 1.6, cap: 'B: user 3 요청 → A가 쥐고 있어 대기', fn: wait('B') },
    { d: 2.6, cap: 'DEADLOCK — 서로가 서로를 기다린다 (ERROR 1213)', tone: 'err',
      fn: function (s) { s.deadlock = true; s.fresh = { kind: 'deadlock' }; } },
    { d: 1.8, cap: 'InnoDB가 작은 쪽(변경한 행이 적은 쪽)을 롤백 — 여기선 B → 8·2·9 해제', tone: 'err',
      fn: function (s) {
        s.deadlock = false;
        s.released = [];
        Object.keys(s.locks).forEach(function (id) {
          if (s.locks[id] === 'B') { s.released.push(+id); delete s.locks[id]; }
        });
        s.B.wait = null; s.B.status = '롤백됨'; s.B.rolled = true;
        s.fresh = { kind: 'rollback' };
      } },
    { d: 0.8, cap: 'A: 기다리던 user 9 획득, 계속 진행', fn: function (s) { s.A.status = '진행 중'; lock('A')(s); } },
    { d: 0.35, cap: 'A: 나머지 잠금', fn: lock('A') },
    { d: 0.35, cap: 'A: 나머지 잠금', fn: lock('A') },
    { d: 0.35, cap: 'A: 나머지 잠금', fn: lock('A') },
    { d: 0.35, cap: 'A: 나머지 잠금', fn: lock('A') },
    { d: 0.35, cap: 'A: 나머지 잠금', fn: lock('A') },
    { d: 0.35, cap: 'A: 나머지 잠금', fn: lock('A') },
    { d: 2.4, cap: 'A 커밋. B는 처음부터 다시 실행해야 한다', tone: 'ok',
      fn: function (s) { s.A.status = '커밋'; s.A.committed = true; s.locks = {}; s.fresh = { kind: 'commit' }; } }
  ];

  // 위 d 값은 기준 박자다. 실제 재생은 SLOW배로 늘려 쓴다.
  var SLOW = 1.5;
  STEPS.forEach(function (st) { st.d *= SLOW; });

  var TOTAL = STEPS.reduce(function (n, st) { return n + st.d; }, 0);

  function stateAt(t) {
    var s = {
      locks: {}, deadlock: false, released: [],
      A: { done: 0, wait: null, status: '진행 중' },
      B: { done: 0, wait: null, status: '진행 중' },
      fresh: null
    };
    var acc = 0;
    for (var i = 0; i < STEPS.length; i++) {
      var st = STEPS[i];
      if (i > 0) { s.fresh = null; s.released = []; }
      st.fn(s);
      if (t < acc + st.d || i === STEPS.length - 1) {
        return { s: s, step: st, p: Math.min(1, (t - acc) / st.d) };
      }
      acc += st.d;
    }
  }

  // ── 좌표
  var CHIP = { x0: 150, w: 50, gap: 8, h: 26 };
  var LANE = { A: 62, B: 296 };
  var CELL = { x0: 25, w: 62, gap: 10, y: 170, h: 56 };
  function chipX(i) { return CHIP.x0 + i * (CHIP.w + CHIP.gap); }
  function cellX(id) { return CELL.x0 + (id - 1) * (CELL.w + CELL.gap); }
  function ease(p) { p = Math.max(0, Math.min(1, p)); return p * p * (3 - 2 * p); }

  function line(x1, y1, x2, y2, color, opts) {
    opts = opts || {};
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' +
      ' style="stroke:var(' + color + ');stroke-width:' + (opts.w || 2) + ';opacity:' + (opts.o == null ? 1 : opts.o) + '"' +
      (opts.dash ? ' stroke-dasharray="6 5" stroke-dashoffset="' + opts.dashOffset + '"' : '') +
      ' marker-end="url(#m' + color.replace('--', '') + ')"/>';
  }
  function text(x, y, str, style, cls) {
    return '<text x="' + x + '" y="' + y + '"' + (cls ? ' class="' + cls + '"' : '') + ' style="' + style + '">' + str + '</text>';
  }

  function render(t) {
    var r = stateAt(t), s = r.s, p = r.p, f = s.fresh;
    var appear = ease(p * 3);
    var out = [];

    out.push('<defs>');
    ['--a', '--b', '--err', '--mute'].forEach(function (c) {
      out.push('<marker id="m' + c.replace('--', '') + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
        '<path d="M0,0 L10,5 L0,10 z" style="fill:var(' + c + ')"/></marker>');
    });
    out.push('</defs>');

    out.push('<rect x="0" y="0" width="760" height="400" rx="12" style="fill:var(--bg);stroke:var(--hair)"/>');
    out.push(text(380, 30, '같은 user 1~10을, 서로 다른 순서로 잠그면', 'fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle'));

    // ── 레인(트랜잭션)
    ['A', 'B'].forEach(function (who) {
      var y = LANE[who], L = s[who], col = who === 'A' ? '--a' : '--b', soft = who === 'A' ? '--a-soft' : '--b-soft';
      var dim = L.rolled;
      var labelStroke = (s.deadlock && L.wait) ? '--err' : (L.committed ? '--ok' : col);
      out.push('<rect x="20" y="' + (y - 6) + '" width="118" height="38" rx="8" style="fill:var(--surface);stroke:var(' + labelStroke + ');stroke-width:1.5;opacity:' + (dim ? 0.6 : 1) + '"/>');
      out.push(text(79, y + 9, '트랜잭션 ' + who, 'fill:var(' + col + ');font-size:13px;font-weight:700;text-anchor:middle'));
      var stCol = L.rolled ? '--err' : L.committed ? '--ok' : L.wait ? (s.deadlock ? '--err' : '--mute') : '--mute';
      out.push(text(79, y + 25, L.status, 'fill:var(' + stCol + ');font-size:11px;text-anchor:middle'));

      ORDER[who].forEach(function (id, i) {
        var x = chipX(i), fill = '--surface', stroke = '--hair', tc = '--mute', o = 1, dash = '';
        if (i < L.done) { fill = soft; stroke = col; tc = col; }
        if (L.wait && i === L.done) { stroke = s.deadlock ? '--err' : col; tc = stroke; dash = ' stroke-dasharray="4 3"'; }
        if (L.rolled) { fill = '--surface'; stroke = '--hair'; tc = '--mute'; o = 0.55; }
        if (f && f.kind === 'lock' && f.who === who && i === L.done - 1) o = 0.4 + 0.6 * appear;
        out.push('<rect x="' + x + '" y="' + y + '" width="' + CHIP.w + '" height="' + CHIP.h + '" rx="6"' + dash +
          ' style="fill:var(' + fill + ');stroke:var(' + stroke + ');stroke-width:1.5;opacity:' + o + '"/>');
        out.push(text(x + CHIP.w / 2, y + 17, String(id), 'fill:var(' + tc + ');font-size:13px;font-weight:600;text-anchor:middle;opacity:' + o, 'mono'));
      });
      if (L.rolled) {
        out.push('<line x1="' + (chipX(0) - 4) + '" y1="' + (y + 13) + '" x2="' + (chipX(9) + CHIP.w + 4) + '" y2="' + (y + 13) +
          '" style="stroke:var(--err);stroke-width:1.5;opacity:' + (f && f.kind === 'rollback' ? appear : 1) + '"/>');
      }
    });
    out.push(text(chipX(0), LANE.A - 12, '잠그는 순서 →', 'fill:var(--mute);font-size:11px'));
    out.push(text(chipX(0), LANE.B + CHIP.h + 18, '잠그는 순서 →', 'fill:var(--mute);font-size:11px'));

    // ── 행(user 1~10)
    var cyc = s.deadlock ? [s.A.wait, s.B.wait] : [];
    for (var id = 1; id <= 10; id++) {
      var x = cellX(id), owner = s.locks[id];
      var fill = '--surface', stroke = '--hair-strong', tc = '--ink-body', o = 1;
      if (owner === 'A') { fill = '--a-soft'; stroke = '--a'; tc = '--a'; }
      if (owner === 'B') { fill = '--b-soft'; stroke = '--b'; tc = '--b'; }
      if (cyc.indexOf(id) >= 0) { stroke = '--err'; }
      if (f && f.kind === 'lock' && f.id === id) o = appear;
      var released = s.released.indexOf(id) >= 0;
      // 바탕은 항상 그리고, 잠금 색만 겹쳐 페이드
      out.push('<rect x="' + x + '" y="' + CELL.y + '" width="' + CELL.w + '" height="' + CELL.h + '" rx="8" style="fill:var(--surface);stroke:var(--hair-strong);stroke-width:1"/>');
      if (owner) {
        out.push('<rect x="' + x + '" y="' + CELL.y + '" width="' + CELL.w + '" height="' + CELL.h + '" rx="8" style="fill:var(' + fill + ');stroke:var(' + stroke + ');stroke-width:' + (cyc.indexOf(id) >= 0 ? 2.5 : 1.5) + ';opacity:' + o + '"/>');
        out.push(text(x + CELL.w / 2, CELL.y + 16, owner + ' 잠금', 'fill:var(' + tc + ');font-size:10px;font-weight:700;text-anchor:middle;opacity:' + o));
      }
      if (released) {
        var ro = 1 - appear;
        out.push('<rect x="' + x + '" y="' + CELL.y + '" width="' + CELL.w + '" height="' + CELL.h + '" rx="8" style="fill:var(--b-soft);stroke:var(--b);stroke-width:1.5;opacity:' + ro + '"/>');
        out.push(text(x + CELL.w / 2, CELL.y + 16, '해제', 'fill:var(--err);font-size:10px;font-weight:700;text-anchor:middle;opacity:' + (0.4 + 0.6 * (1 - Math.abs(appear - 0.5) * 2))));
      }
      out.push(text(x + CELL.w / 2, CELL.y + 38, 'user ' + id, 'fill:var(' + (owner ? tc : '--ink-body') + ');font-size:12px;font-weight:600;text-anchor:middle', 'mono'));
    }

    // ── 화살표: 대기
    var dashOffset = (-t * 18 / SLOW).toFixed(1);
    ['A', 'B'].forEach(function (who) {
      var L = s[who];
      if (!L.wait) return;
      var cx = chipX(L.done) + CHIP.w / 2, tx = cellX(L.wait) + CELL.w / 2;
      var col = s.deadlock ? '--err' : (who === 'A' ? '--a' : '--b');
      var o = (f && f.kind === 'wait' && f.who === who) ? appear : 1;
      if (who === 'A') out.push(line(cx, LANE.A + CHIP.h + 2, tx, CELL.y - 4, col, { dash: true, dashOffset: dashOffset, o: o }));
      else out.push(line(cx, LANE.B - 2, tx, CELL.y + CELL.h + 4, col, { dash: true, dashOffset: dashOffset, o: o }));
      var mx = (cx + tx) / 2, my = who === 'A' ? (LANE.A + CHIP.h + CELL.y) / 2 : (LANE.B + CELL.y + CELL.h) / 2;
      out.push('<rect x="' + (mx - 18) + '" y="' + (my - 10) + '" width="36" height="18" rx="9" style="fill:var(--bg);opacity:' + o + '"/>');
      out.push(text(mx, my + 3, '대기', 'fill:var(' + col + ');font-size:11px;font-weight:700;text-anchor:middle;opacity:' + o));
    });

    // ── 화살표: 데드락 때 "누가 쥐고 있나"를 이어 고리를 닫는다
    if (s.deadlock) {
      var o2 = f && f.kind === 'deadlock' ? appear : 1;
      var a9 = ORDER.B.indexOf(s.A.wait), b3 = ORDER.A.indexOf(s.B.wait);
      out.push(line(cellX(s.A.wait) + CELL.w / 2, CELL.y + CELL.h + 4, chipX(a9) + CHIP.w / 2, LANE.B - 2, '--err', { o: o2 }));
      out.push(line(cellX(s.B.wait) + CELL.w / 2, CELL.y - 4, chipX(b3) + CHIP.w / 2, LANE.A + CHIP.h + 2, '--err', { o: o2 }));
    }

    // ── 획득 순간의 실선
    if (f && f.kind === 'lock') {
      var L2 = s[f.who], ci = L2.done - 1;
      var cx2 = chipX(ci) + CHIP.w / 2, tx2 = cellX(f.id) + CELL.w / 2;
      var col2 = f.who === 'A' ? '--a' : '--b';
      var lo = p < 0.6 ? 1 : 1 - ease((p - 0.6) / 0.4);
      if (f.who === 'A') out.push(line(cx2, LANE.A + CHIP.h + 2, tx2, CELL.y - 4, col2, { o: lo }));
      else out.push(line(cx2, LANE.B - 2, tx2, CELL.y + CELL.h + 4, col2, { o: lo }));
    }

    // ── 캡션
    var tone = r.step.tone;
    var cf = tone === 'err' ? '--err-soft' : tone === 'ok' ? '--ok-soft' : '--surface';
    var cs = tone === 'err' ? '--err' : tone === 'ok' ? '--ok' : '--hair';
    var ct = tone === 'err' ? '--err' : tone === 'ok' ? '--ok' : '--ink';
    out.push('<rect x="20" y="350" width="720" height="36" rx="8" style="fill:var(' + cf + ');stroke:var(' + cs + ')"/>');
    out.push(text(380, 373, r.step.cap, 'fill:var(' + ct + ');font-size:14px;font-weight:' + (tone ? 700 : 500) + ';text-anchor:middle'));

    document.getElementById('scene').innerHTML = out.join('');
  }

  // ── 재생과 조작
  var q = new URLSearchParams(location.search);
  var root = document.documentElement;
  var themeSel = document.getElementById('theme');
  var theme = q.get('theme') || 'light';
  root.dataset.theme = theme; themeSel.value = theme;
  themeSel.onchange = function () { root.dataset.theme = themeSel.value; };

  window.__total = TOTAL;
  window.__render = render;
  window.__size = [760, 400];

  if (q.has('capture')) {
    document.body.classList.add('capture');
    render(parseFloat(q.get('t') || '0'));
    return;
  }

  var scrub = document.getElementById('scrub'), clock = document.getElementById('clock'), btn = document.getElementById('play');
  scrub.max = TOTAL.toFixed(2);
  var playing = true, t = 0, last = null;
  btn.onclick = function () { playing = !playing; btn.textContent = playing ? '일시정지' : '재생'; last = null; };
  scrub.oninput = function () { t = parseFloat(scrub.value); render(t); clock.textContent = t.toFixed(1) + 's'; };
  function tick(now) {
    if (playing) {
      if (last != null) t = (t + (now - last) / 1000) % TOTAL;
      last = now;
      render(t);
      scrub.value = t; clock.textContent = t.toFixed(1) + 's';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
