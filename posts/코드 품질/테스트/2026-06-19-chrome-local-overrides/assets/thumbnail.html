<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Local Overrides 썸네일</title>
<style>
  /* 색은 의존성 주입 썸네일과 같다 — 대표이미지끼리 같은 그림체로 */
  :root {
    --bg: #fafafa; --surface: #ffffff; --hair: #ebebeb; --hair-strong: #a1a1a1;
    --ink: #171717; --ink-body: #4d4d4d; --mute: #707070;
    --a: #0057c2; --a-soft: #d3e5ff;
    --err: #c00000; --err-soft: #ffe1e1;
  }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  svg { display: block; width: 1600px; height: 1000px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-ligatures: none; }
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1600 1000"></svg>
<script>
// 글 「Chrome Local Overrides로 API 응답을 변경하고 UI를 테스트하는 방법」의 대표이미지(= og:image).
// 기본은 b(제목 + 도식), a는 글자 없는 판.
// 다시 찍기: Chrome --headless=new --force-device-scale-factor=1 --window-size=1600,1000 --screenshot=thumbnail.png 'thumbnail.html?v=b'
var v = new URLSearchParams(location.search).get('v') || 'b';

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function text(x, y, s, style, cls) {
  return '<text x="' + x + '" y="' + y + '"' + (cls ? ' class="' + cls + '"' : '') + ' style="' + style + '">' + esc(s) + '</text>';
}
function rect(x, y, w, h, fill, stroke, sw, rx, extra) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 20) + '"' + (extra || '') +
    ' style="fill:var(' + fill + ');stroke:var(' + stroke + ');stroke-width:' + sw + '"/>';
}
function curve(d, col, dash, w) {
  return '<path d="' + d + '" fill="none"' + (dash ? ' stroke-dasharray="16 12"' : '') + ' stroke-linecap="round"' +
    ' style="stroke:var(' + col + ');stroke-width:' + (w || 6) + '" marker-end="url(#m' + col.slice(2) + ')"/>';
}
function pill(cx, cy, s, fill, stroke, col, size) {
  var w = s.length * size * 0.95 + size * 1.4, h = size * 1.9;
  return rect(cx - w / 2, cy - h / 2, w, h, fill, stroke, 4, h / 2) +
    text(cx, cy + size * 0.36, s, 'fill:var(' + col + ');font-size:' + size + 'px;font-weight:800;text-anchor:middle');
}
function defs() {
  return '<defs>' + ['--a'].map(function (c) {
    return '<marker id="m' + c.slice(2) + '" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto">' +
      '<path d="M0,0 L10,5 L0,10 z" style="fill:var(' + c + ')"/></marker>';
  }).join('') + '</defs>';
}

// 도식 — 0,0 ~ 820,584. 서버 응답 대신 로컬 파일이 화면에 그려진다
var W = 820, H = 584;
// 응답 카드 — 제목 한 줄 + JSON 한 줄
function payload(x, y, w, h, label, json, fill, stroke, col, dash) {
  return rect(x, y, w, h, fill, stroke, 4, 18, dash ? ' stroke-dasharray="14 10"' : '') +
    text(x + 28, y + 52, label, 'fill:var(' + col + ');font-size:30px;font-weight:800') +
    text(x + 28, y + 118, json, 'fill:var(' + col + ');font-size:32px;white-space:pre', 'mono');
}
function diagram() {
  var out = [];
  var BX = 470, BY = 60, BW = 350, BH = 464;   // 브라우저

  // 선 — 상자 아래에 먼저
  // 서버 응답은 브라우저에 닿기 전에 끊긴다 — 화살촉 없이 ✕에서 멈춘다
  out.push('<path d="M330,135 C370,135 380,170 398,190" fill="none" stroke-dasharray="16 12" stroke-linecap="round" style="stroke:var(--hair-strong);stroke-width:5"/>');
  out.push(curve('M330,430 C410,430 400,320 466,320', '--a', false, 7));

  out.push(payload(0, 40, 330, 190, '서버 응답', '{"count": 0}', '--bg', '--hair-strong', '--mute', true));
  out.push(payload(0, 334, 330, 190, 'Local Override', '{"count": 123}', '--a-soft', '--a', '--a'));
  out.push(text(0, 572, 'overrides/…/count.json', 'fill:var(--mute);font-size:24px', 'mono'));
  out.push(pill(410, 200, '✕', '--err-soft', '--err', '--err', 28));

  // 브라우저 — 메일 아이콘에 123이 붙는다
  out.push(rect(BX, BY, BW, BH, '--surface', '--hair-strong', 4, 22));
  out.push('<path d="M' + (BX + 4) + ',' + (BY + 56) + ' H' + (BX + BW - 4) + '" style="stroke:var(--hair);stroke-width:3"/>');
  ['#ff5f57', '#febc2e', '#28c840'].forEach(function (c, i) {
    out.push('<circle cx="' + (BX + 34 + i * 30) + '" cy="' + (BY + 29) + '" r="9" fill="' + c + '"/>');
  });
  var ex = BX + 70, ey = BY + 120;              // 봉투
  out.push(rect(ex, ey, 120, 84, '--surface', '--ink-body', 5, 10));
  out.push('<path d="M' + (ex + 6) + ',' + (ey + 8) + ' L' + (ex + 60) + ',' + (ey + 48) + ' L' + (ex + 114) + ',' + (ey + 8) +
    '" fill="none" stroke-linejoin="round" style="stroke:var(--ink-body);stroke-width:5"/>');
  out.push(rect(ex + 84, ey - 30, 112, 60, '--a', '--surface', 5, 30));
  out.push(text(ex + 140, ey + 12, '123', 'fill:var(--surface);font-size:36px;font-weight:800;text-anchor:middle', 'mono'));
  [[260, 250], [310, 200], [360, 230], [410, 170]].forEach(function (r) {
    out.push(rect(BX + 50, BY + r[0], r[1], 22, '--hair', '--hair', 0, 11));
  });
  return out.join('');
}
function place(inner, cx, cy, s) {
  return '<g transform="translate(' + cx + ',' + cy + ') scale(' + s + ') translate(' + (-W / 2) + ',' + (-H / 2) + ')">' + inner + '</g>';
}

var out = defs() + '<rect width="1600" height="1000" style="fill:var(--bg)"/>';
if (v === 'a') {
  out += place(diagram(), 800, 500, 1.3);
} else {
  out += text(130, 370, 'Chrome DevTools', 'fill:var(--mute);font-size:36px;font-weight:600');
  out += text(124, 490, 'Local', 'fill:var(--ink);font-size:96px;font-weight:800;letter-spacing:-2px');
  out += text(124, 610, 'Overrides', 'fill:var(--ink);font-size:96px;font-weight:800;letter-spacing:-2px');
  out += place(diagram(), 1120, 500, 0.8);
}
document.getElementById('s').innerHTML = out;
</script>
</body>
</html>
