<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스프링 IoC 컨테이너 썸네일</title>
<style>
  /* 색은 1편 thumbnail.html·글 속 애니메이션과 같다 */
  :root {
    --bg: #fafafa; --surface: #ffffff; --hair: #ebebeb; --hair-strong: #a1a1a1;
    --ink: #171717; --ink-body: #4d4d4d; --mute: #707070;
    --a: #0057c2; --a-soft: #d3e5ff;
    --b: #945800; --b-soft: #fdebc8;
    --ok: #0b6b4b; --ok-soft: #d6f5ea;
  }
  :root[data-theme="dark"] {
    --bg: #0a0a0a; --surface: #161616; --hair: #2e2e2e; --hair-strong: #454545;
    --ink: #ededed; --ink-body: #b0b0b0; --mute: #8f8f8f;
    --a: #3291ff; --a-soft: #10233f;
    --b: #f7b955; --b-soft: #3a2a0e;
    --ok: #50e3c2; --ok-soft: #0f2e27;
  }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  svg { display: block; width: 1600px; height: 1000px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-ligatures: none; }
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1600 1000"></svg>
<script>
// 글 대표이미지(= og:image). 시안 넷 중 a(1편과 같은 결 — 제목 + 도식)로 정했다(2026-10-17) — b(a의 다크)·c(도식만)·d(글자만)는 비교용으로 남긴다.
// 찍기: Chrome --headless=new --force-device-scale-factor=1 --window-size=1600,1000 --screenshot=thumbnail.png 'thumbnail.html?v=a'
var v = new URLSearchParams(location.search).get('v') || 'a';
if (v === 'b') document.documentElement.dataset.theme = 'dark';

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function text(x, y, s, style, cls) {
  return '<text x="' + x + '" y="' + y + '"' + (cls ? ' class="' + cls + '"' : '') + ' style="' + style + '">' + esc(s) + '</text>';
}
function rect(x, y, w, h, fill, stroke, sw, rx, extra) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 20) + '"' + (extra || '') +
    ' style="fill:var(' + fill + ');stroke:var(' + stroke + ');stroke-width:' + sw + '"/>';
}
function defs() {
  return '<defs>' + ['--a', '--b', '--ok', '--hair-strong'].map(function (c) {
    return '<marker id="m' + c.slice(2) + '" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto">' +
      '<path d="M0,0 L10,5 L0,10 z" style="fill:var(' + c + ')"/></marker>';
  }).join('') + '</defs>';
}

// 도식 — ApplicationContext가 DefaultListableBeanFactory를 품고, 그 안에서 빈 정의가 싱글톤이 된다. 원점 (0,0), 크기 760×600
function diagram() {
  var out = [];
  // ApplicationContext
  out.push(rect(0, 0, 760, 600, '--surface', '--b', 5, 28));
  out.push(text(40, 64, 'ApplicationContext', 'fill:var(--b);font-size:38px;font-weight:800', 'mono'));
  ['이벤트', '메시지', '환경', '리소스'].forEach(function (s, i) {
    var x = 40 + i * 132;
    out.push(rect(x, 92, 116, 46, '--b-soft', '--b', 2, 23));
    out.push(text(x + 58, 123, s, 'fill:var(--b);font-size:22px;font-weight:700;text-anchor:middle'));
  });
  // BeanFactory
  out.push(rect(40, 170, 680, 390, '--bg', '--a', 4, 22));
  out.push(text(72, 220, 'DefaultListableBeanFactory', 'fill:var(--a);font-size:28px;font-weight:800', 'mono'));
  out.push(text(72, 278, 'beanDefinitionMap', 'fill:var(--mute);font-size:21px;font-weight:600', 'mono'));
  out.push(text(436, 278, 'singletonObjects', 'fill:var(--mute);font-size:21px;font-weight:600', 'mono'));
  ['OrderFacadeService', 'OrderService', 'PaymentClient'].forEach(function (s, i) {
    var y = 300 + i * 80;
    out.push(rect(72, y, 260, 60, '--surface', '--hair-strong', 3, 14, ' stroke-dasharray="10 7"'));
    out.push(text(202, y + 39, s, 'fill:var(--ink-body);font-size:21px;font-weight:600;text-anchor:middle', 'mono'));
    out.push('<line x1="342" y1="' + (y + 30) + '" x2="420" y2="' + (y + 30) + '" style="stroke:var(--ok);stroke-width:4" marker-end="url(#mok)"/>');
    out.push(rect(432, y, 256, 60, '--ok-soft', '--ok', 3, 14));
    out.push(text(560, y + 39, s, 'fill:var(--ok);font-size:21px;font-weight:700;text-anchor:middle', 'mono'));
  });
  return out.join('');
}
function place(inner, cx, cy, s) {
  return '<g transform="translate(' + cx + ',' + cy + ') scale(' + s + ') translate(-380,-300)">' + inner + '</g>';
}

var out = defs() + '<rect width="1600" height="1000" style="fill:var(--bg)"/>';

if (v === 'a' || v === 'b') {
  // 제목 + 도식 (1편 썸네일과 같은 배치)
  out += text(130, 360, '스프링', 'fill:var(--mute);font-size:36px;font-weight:600');
  out += text(124, 480, 'IoC 컨테이너', 'fill:var(--ink);font-size:96px;font-weight:800;letter-spacing:-2px');
  out += text(128, 560, 'BeanFactory와', 'fill:var(--a);font-size:40px;font-weight:700', 'mono');
  out += text(128, 616, 'ApplicationContext', 'fill:var(--b);font-size:40px;font-weight:700', 'mono');
  out += place(diagram(), 1130, 500, 0.9);
} else if (v === 'c') {
  // 글자 없는 판 — 도식만
  out += place(diagram(), 800, 500, 1.25);
} else {
  // 글자만 — 제목과 키워드
  out += text(800, 330, '스프링', 'fill:var(--mute);font-size:40px;font-weight:600;text-anchor:middle');
  out += text(800, 470, 'IoC 컨테이너', 'fill:var(--ink);font-size:128px;font-weight:800;letter-spacing:-3px;text-anchor:middle');
  out += text(800, 570, 'BeanFactory와 ApplicationContext', 'fill:var(--ink-body);font-size:44px;font-weight:700;text-anchor:middle', 'mono');
  var chips = [['IoC', '--a'], ['DI', '--a'], ['refresh()', '--b'], ['singletonObjects', '--ok']];
  var widths = chips.map(function (c) { return c[0].length * 17 + 56; });
  var total = widths.reduce(function (a, b) { return a + b; }, 0) + 24 * (chips.length - 1), x = 800 - total / 2;
  chips.forEach(function (c, i) {
    out += rect(x, 640, widths[i], 60, c[1] + '-soft', c[1], 3, 30);
    out += text(x + widths[i] / 2, 680, c[0], 'fill:var(' + c[1] + ');font-size:28px;font-weight:700;text-anchor:middle', 'mono');
    x += widths[i] + 24;
  });
}
document.getElementById('s').innerHTML = out;
</script>
</body>
</html>
