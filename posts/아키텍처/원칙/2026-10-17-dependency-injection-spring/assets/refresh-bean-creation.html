<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>refresh() 빈 생성</title>
<style>
  /* 바탕·글자 회색은 DESIGN.md 토큰이다. --a·--b·--err·--ok와 옅은 면(-soft)은 이 그림용으로 따로 정했다 —
     라이트에서 각 색 글자가 자기 옅은 면 위 4.5:1을 넘도록 토큰보다 어둡게 잡았다(SKILL.md 「그리기 규칙」) */
  :root {
    --page: #ffffff; --bg: #fafafa; --surface: #ffffff;
    --hair: #ebebeb; --hair-strong: #a1a1a1;
    --ink: #171717; --ink-body: #4d4d4d; --mute: #707070;
    --a: #0057c2; --a-soft: #d3e5ff;
    --b: #945800; --b-soft: #fdebc8;
    --err: #c00000; --err-soft: #ffe1e1;
    --ok: #0b6b4b; --ok-soft: #d6f5ea;
  }
  :root[data-theme="dark"] {
    --page: #0a0a0a; --bg: #121212; --surface: #1a1a1a;
    --hair: #2e2e2e; --hair-strong: #454545;
    --ink: #ededed; --ink-body: #b0b0b0; --mute: #8f8f8f;
    --a: #3291ff; --a-soft: #10233f;
    --b: #f7b955; --b-soft: #3a2a0e;
    --err: #ff6166; --err-soft: #3d1416;
    --ok: #50e3c2; --ok-soft: #0f2e27;
  }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; padding: 16px; }
  .stage { max-width: 960px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; }
  .mono { font-family: "JetBrains Mono", "D2Coding", ui-monospace, SFMono-Regular, Menlo, monospace; }
  .controls { display: flex; gap: 12px; align-items: center; margin-top: 12px; font-size: 14px; color: var(--ink-body); }
  .controls input[type=range] { flex: 1; }
  .controls button, .controls select { font: inherit; padding: 4px 10px; }
  /* 캡처 모드: 조작 막대를 숨기고 장면만 남긴다 (render-gif.mjs가 body.capture를 확인한다) */
  /* 캡처 모드에서는 판 폭 제한을 푼다 — W를 바꿔도 .stage가 760에 묶여 작게 찍히지 않게 */
  body.capture { padding: 0; }
  body.capture .stage { max-width: none; }
  body.capture .controls { display: none; }
</style>
</head>
<body>
<div class="stage">
  <!-- aria-label에는 장면 전체를 한 문장으로. GIF로 구우면 사라지지만 HTML로 볼 때를 위해 둔다 -->
  <svg id="scene" viewBox="0 0 960 440" role="img" aria-label="refresh()가 빈을 만드는 과정: beanDefinitionMap의 정의를 차례로 getBean()한다. OrderFacadeService의 생성자 인자 DistributedLockExecutor, PaymentClient, OrderService가 없으니 먼저 만들고, OrderService는 다시 OrderRepository, UserRepository, ProductRepository를 먼저 만든다. 만들어진 객체는 후처리를 지나 singletonObjects에 들어가고, 인자가 다 모인 뒤에야 OrderFacadeService 생성자가 한 번 호출된다. 나머지 정의는 이미 있어 새로 만들지 않고, 다시 getBean()하면 같은 객체를 꺼낸다."></svg>
  <div class="controls">
    <button id="play" type="button">일시정지</button>
    <input id="scrub" type="range" min="0" step="0.01">
    <span id="clock" class="mono">0.0s</span>
    <select id="theme"><option value="light">라이트</option><option value="dark">다크</option></select>
  </div>
</div>
<script>
(function () {
  var W = 960, H = 440;   // viewBox와 같아야 한다

  // ════════════════════════════════════════════════════════════
  // 장면 — 여기부터 바꾼다
  // ════════════════════════════════════════════════════════════

  // 처음 상태. 매 프레임 여기서 출발해 단계를 다시 쌓는다 (그래서 render(t)가 t만의 함수가 된다)
  // n[키]: null(안 보임) | 'need'(필요한데 아직 없음) | 'wait'(생성 시작, 인자 기다림) | 'done'(생성 완료)
  function initial() {
    return {
      defs: false, cursor: null, skip: false, final: false,
      n: { F: null, L: null, P: null, O: null, OR: null, UR: null, PR: null },
      prev: {}, made: [], newMade: [], fresh: null
    };
  }

  // 단계마다 새로 시작하는 값. 엔진이 각 단계의 fn 직전에 부른다 — 「그 단계에서만 보이는 것」을 여기서 지운다
  function eachStep(s) { s.fresh = null; s.newMade = []; s.prev = {}; }

  function need(s, keys) { keys.forEach(function (k) { s.n[k] = 'need'; }); }
  function make(s, keys) {
    keys.forEach(function (k) { s.prev[k] = s.n[k]; s.n[k] = 'done'; s.made.push(k); s.newMade.push(k); });
    s.fresh = 'make';
  }

  // 단계: d = 기준 박자(초), cap = 아래 캡션, tone = 'err' | 'ok' | 생략, fn = 상태를 바꾼다.
  // fn에서 s.fresh를 세우면 그 단계 동안 draw()가 p(0→1)로 나타나기 효과를 줄 수 있다.
  // 정의 순서는 예시다 — 컴포넌트 스캔 순서는 정해져 있지 않다. 어느 빈부터 시작해도 의존성이 먼저 만들어진다
  var STEPS = [
    { d: 1.8, cap: '빈 정의 7개가 beanDefinitionMap에 모였다 — 이제 싱글톤을 만든다', fn: function (s) { s.defs = true; s.fresh = 'defs'; } },
    { d: 2.0, cap: '정의 순서대로 getBean() — 여기선 OrderFacadeService가 첫 번째', fn: function (s) { s.cursor = 0; s.n.F = 'wait'; s.fresh = 'F'; } },
    { d: 2.4, cap: '생성자 인자 3개가 아직 없다 → getBean()으로 그것부터 만든다', fn: function (s) { need(s, ['L', 'P', 'O']); s.fresh = 'need1'; } },
    { d: 2.0, cap: 'DistributedLockExecutor 생성 → 후처리 → singletonObjects', fn: function (s) { make(s, ['L']); } },
    { d: 1.8, cap: 'PaymentClient도 같은 길로', fn: function (s) { make(s, ['P']); } },
    { d: 2.4, cap: 'OrderService도 인자 3개가 필요하다 → 한 단계 더 내려간다', fn: function (s) { s.n.O = 'wait'; need(s, ['OR', 'UR', 'PR']); s.fresh = 'need2'; } },
    { d: 2.6, cap: 'Repository 3개 생성 → singletonObjects', fn: function (s) { make(s, ['OR', 'UR', 'PR']); } },
    { d: 2.0, cap: '인자가 다 모였다 → OrderService 생성자 호출', fn: function (s) { make(s, ['O']); } },
    { d: 2.4, cap: 'OrderFacadeService 생성자 호출 — 객체는 이때 한 번 생긴다', tone: 'ok', fn: function (s) { make(s, ['F']); } },
    { d: 2.4, cap: '나머지 6개도 getBean() — 이미 singletonObjects에 있어 새로 만들지 않는다', fn: function (s) { s.cursor = null; s.skip = true; s.fresh = 'skip'; } },
    { d: 2.6, cap: '다시 getBean(OrderFacadeService) → 새로 만들지 않고 같은 객체를 꺼낸다', tone: 'ok', fn: function (s) { s.cursor = null; s.final = true; s.fresh = 'final'; } }
  ];

  // 판 배치
  var NAME = {
    F: 'OrderFacadeService', O: 'OrderService', L: 'DistributedLockExecutor', P: 'PaymentClient',
    OR: 'OrderRepository', UR: 'UserRepository', PR: 'ProductRepository'
  };
  var DEFS = ['F', 'O', 'L', 'P', 'OR', 'UR', 'PR'];          // beanDefinitionMap의 순서 (예시)
  var NW = 152, NH = 46;
  var POS = {
    F: [388, 70],
    L: [222, 160], P: [388, 160], O: [554, 160],
    OR: [222, 250], UR: [388, 250], PR: [554, 250]
  };
  var EDGES = [['F', 'L'], ['F', 'P'], ['F', 'O'], ['O', 'OR'], ['O', 'UR'], ['O', 'PR']];
  var LP = { x: 16, w: 190 }, RP = { x: 750, w: 196 }, PY = 52, PH = 286;
  var GATE = { x: 712, w: 30 };
  function rowY(i) { return 88 + i * 34; }

  function lerp(a, b, k) { return a + (b - a) * k; }
  // 구간 [a, b] 안에서 0→1
  function seg(p, a, b) { return ease((p - a) / (b - a)); }

  var LOOK = {
    need: { fill: 'var(--surface)', stroke: 'var(--hair-strong)', ink: 'var(--ink-body)', sub: '아직 없음 → getBean()', dash: true },
    wait: { fill: 'var(--a-soft)', stroke: 'var(--a)', ink: 'var(--a)', sub: '인자를 기다리는 중' },
    done: { fill: 'var(--ok-soft)', stroke: 'var(--ok)', ink: 'var(--ok)', sub: '생성됨' }
  };
  function node(k, state, o) {
    var x = POS[k][0], y = POS[k][1], L = LOOK[state];
    return '<rect x="' + x + '" y="' + y + '" width="' + NW + '" height="' + NH + '" rx="8"' + (L.dash ? ' stroke-dasharray="5 4"' : '') +
      ' style="fill:' + L.fill + ';stroke:' + L.stroke + ';stroke-width:1.5;opacity:' + o + '"/>' +
      text(x + NW / 2, y + 20, NAME[k], 'fill:' + L.ink + ';font-size:11.5px;font-weight:700;text-anchor:middle;opacity:' + o) +
      text(x + NW / 2, y + 36, L.sub, 'fill:var(--mute);font-size:10.5px;text-anchor:middle;opacity:' + o);
  }

  // 이번 단계에서 만들어지는 빈의 시간표: 상자가 바뀌고(a), 칩이 후처리를 지나(b→c) singletonObjects에 든다
  function plan(s, k) {
    var j = s.newMade.indexOf(k), off = j * 0.12;
    return { a: seg(s.p, off, off + 0.2), k: seg(s.p, off + 0.2, off + 0.62), land: seg(s.p, off + 0.58, off + 0.68) };
  }

  function draw(r, t) {
    var s = r.s, p = r.p, out = [];
    s.p = p;
    var appear = ease(p * 3);
    out.push(title('refresh() — 빈은 의존성부터 만들어진다'));

    // ── 왼쪽: beanDefinitionMap
    out.push(box(LP.x, PY, LP.w, PH, 'var(--surface)', 'var(--hair-strong)'));
    out.push(text(LP.x + 12, 74, 'beanDefinitionMap', 'fill:var(--ink);font-size:12px;font-weight:700', 'mono'));
    if (s.defs) {
      var dO = s.fresh === 'defs' ? appear : 1;
      var skipTo = s.skip ? (s.fresh === 'skip' ? 1 + Math.min(5, Math.floor(p / 0.8 * 6)) : 6) : 0;
      DEFS.forEach(function (k, i) {
        var y = rowY(i), cur = s.cursor === i || (s.fresh === 'skip' && i === skipTo && p < 0.9);
        var skipped = s.skip && i >= 1 && i <= skipTo && !(s.fresh === 'skip' && i === skipTo && p < 0.9);
        var fill = cur ? 'var(--a-soft)' : 'var(--bg)', stroke = cur ? 'var(--a)' : 'var(--hair)';
        out.push(box(LP.x + 8, y, LP.w - 16, 28, fill, stroke, dO));
        out.push(text(LP.x + 16, y + 18, NAME[k], 'fill:' + (cur ? 'var(--a)' : skipped ? 'var(--mute)' : 'var(--ink-body)') +
          ';font-size:11px;font-weight:' + (cur ? 700 : 500) + ';opacity:' + dO, 'mono'));
      });
      if (s.cursor === 0 || (s.fresh === 'skip' && p < 0.9)) {
        var ci = s.cursor === 0 ? 0 : skipTo;
        out.push(text(LP.x + LP.w + 4, rowY(ci) + 18, '▶', 'fill:var(--a);font-size:10px'));
      }
    }

    // ── 가운데: 의존성 나무. 화살표는 「필요로 한다」
    EDGES.forEach(function (e) {
      var a = e[0], b = e[1];
      if (!s.n[b]) return;
      var x1 = POS[a][0] + NW / 2, y1 = POS[a][1] + NH, x2 = POS[b][0] + NW / 2, y2 = POS[b][1] - 3;
      var fresh = (s.fresh === 'need1' && a === 'F') || (s.fresh === 'need2' && a === 'O');
      var done = s.n[b] === 'done' && !(s.newMade.indexOf(b) >= 0 && plan(s, b).a < 1);
      out.push(arrow(x1, y1, x2, y2, done ? '--ok' : '--mute', { dash: !done, t: t, w: 1.5, o: fresh ? appear : 1 }));
    });
    Object.keys(POS).forEach(function (k) {
      var st = s.n[k];
      if (!st) return;
      if (s.newMade.indexOf(k) >= 0) {
        var pl = plan(s, k);
        out.push(node(k, s.prev[k], 1));
        out.push(node(k, 'done', pl.a));
        return;
      }
      var o = (s.fresh === 'F' && k === 'F') || (s.fresh === 'need1' && (k === 'L' || k === 'P' || k === 'O')) ||
        (s.fresh === 'need2' && (k === 'OR' || k === 'UR' || k === 'PR')) ? appear : 1;
      out.push(node(k, st, o));
    });

    // ── 후처리 관문
    out.push('<rect x="' + GATE.x + '" y="' + PY + '" width="' + GATE.w + '" height="' + PH + '" rx="8" stroke-dasharray="5 4"' +
      ' style="fill:var(--b-soft);stroke:var(--b);stroke-width:1.5"/>');
    ['후', '처', '리'].forEach(function (c, i) {
      out.push(text(GATE.x + GATE.w / 2, 170 + i * 18, c, 'fill:var(--b);font-size:12px;font-weight:700;text-anchor:middle'));
    });

    // ── 오른쪽: singletonObjects
    out.push(box(RP.x, PY, RP.w, PH, 'var(--surface)', 'var(--hair-strong)'));
    out.push(text(RP.x + 12, 74, 'singletonObjects', 'fill:var(--ink);font-size:12px;font-weight:700', 'mono'));
    s.made.forEach(function (k, i) {
      var o = s.newMade.indexOf(k) >= 0 ? plan(s, k).land : 1;
      var hi = s.final && k === 'F';
      out.push(box(RP.x + 8, rowY(i), RP.w - 16, 28, hi ? 'var(--a-soft)' : 'var(--ok-soft)', hi ? 'var(--a)' : 'var(--ok)', o));
      out.push(text(RP.x + 16, rowY(i) + 18, NAME[k], 'fill:' + (hi ? 'var(--a)' : 'var(--ok)') + ';font-size:11px;font-weight:600;opacity:' + o, 'mono'));
    });

    // ── 만들어진 객체가 후처리를 지나 들어가는 칩
    s.newMade.forEach(function (k) {
      var pl = plan(s, k);
      if (pl.k <= 0 || pl.land >= 1) return;
      var y0 = POS[k][1] + NH / 2, x0 = POS[k][0] + NW + 10, gx = GATE.x + GATE.w / 2;
      var i = s.made.indexOf(k), ty = rowY(i) + 14, tx = RP.x + 20;
      var x, y;
      if (pl.k < 0.6) { x = lerp(x0, gx, pl.k / 0.6); y = y0; }
      else { var q = (pl.k - 0.6) / 0.4; x = lerp(gx, tx, q); y = lerp(y0, ty, q); }
      out.push('<rect x="' + (x - 7).toFixed(1) + '" y="' + (y - 7).toFixed(1) + '" width="14" height="14" rx="3" style="fill:var(--ok);stroke:var(--surface);stroke-width:1.5"/>');
    });

    // ── 마지막: 다시 getBean() 하면 캐시에서 같은 객체
    if (s.final) {
      var fo = appear, fi = s.made.indexOf('F'), fy = rowY(fi) + 14;
      out.push(box(222, 318, 420, 30, 'var(--a-soft)', 'var(--a)', fo));
      out.push(text(432, 338, 'context.getBean(OrderFacadeService) → 같은 객체', 'fill:var(--a);font-size:12px;font-weight:700;text-anchor:middle;opacity:' + fo, 'mono'));
      out.push(arrow(RP.x, fy, 646, 333, '--a', { dash: true, t: t, o: fo }));
    }

    out.push(caption(r.step));
    return out;
  }

  // ════════════════════════════════════════════════════════════
  // 엔진 — 보통은 손대지 않는다
  // ════════════════════════════════════════════════════════════

  // 실제 재생은 기준 박자의 SLOW배. 처음 컷은 사용자가 "빠르다"고 해 1.5로 맞췄다(2026-10-08)
  var SLOW = 1.5;
  STEPS.forEach(function (st) { st.d *= SLOW; });
  var TOTAL = STEPS.reduce(function (n, st) { return n + st.d; }, 0);

  function stateAt(t) {
    var s = initial(), acc = 0;
    for (var i = 0; i < STEPS.length; i++) {
      eachStep(s);
      STEPS[i].fn(s);
      if (t < acc + STEPS[i].d || i === STEPS.length - 1) {
        return { s: s, step: STEPS[i], p: Math.max(0, Math.min(1, (t - acc) / STEPS[i].d)) };
      }
      acc += STEPS[i].d;
    }
  }

  function ease(p) { p = Math.max(0, Math.min(1, p)); return p * p * (3 - 2 * p); }
  // 글자는 innerHTML로 들어가므로 이스케이프한다 — 'WHERE id < 10' 같은 캡션이 태그로 읽혀 조용히 잘린다
  function esc(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function text(x, y, str, style, cls) {
    return '<text x="' + x + '" y="' + y + '"' + (cls ? ' class="' + cls + '"' : '') + ' style="' + style + '">' + esc(str) + '</text>';
  }
  function box(x, y, w, h, fill, stroke, o) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="8" style="fill:' + fill +
      ';stroke:' + stroke + ';stroke-width:1.5;opacity:' + (o == null ? 1 : o) + '"/>';
  }
  // 점선의 흐름도 t로 민다 — CSS 애니메이션을 쓰면 GIF에 안 찍힌다
  function arrow(x1, y1, x2, y2, color, opts) {
    opts = opts || {};
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' +
      ' style="stroke:var(' + color + ');stroke-width:' + (opts.w || 2) + ';opacity:' + (opts.o == null ? 1 : opts.o) + '"' +
      (opts.dash ? ' stroke-dasharray="6 5" stroke-dashoffset="' + (-(opts.t || 0) * 18 / SLOW).toFixed(1) + '"' : '') +
      ' marker-end="url(#m' + color.slice(2) + ')"/>';
  }
  function title(str) {
    return text(W / 2, 30, str, 'fill:var(--ink);font-size:15px;font-weight:700;text-anchor:middle');
  }
  function caption(step) {
    var tone = step.tone;
    var f = tone === 'err' ? '--err-soft' : tone === 'ok' ? '--ok-soft' : '--surface';
    var c = tone === 'err' ? '--err' : tone === 'ok' ? '--ok' : '--hair';
    var tc = tone === 'err' ? '--err' : tone === 'ok' ? '--ok' : '--ink';
    return '<rect x="20" y="' + (H - 50) + '" width="' + (W - 40) + '" height="36" rx="8" style="fill:var(' + f + ');stroke:var(' + c + ')"/>' +
      text(W / 2, H - 27, step.cap, 'fill:var(' + tc + ');font-size:14px;font-weight:' + (tone ? 700 : 500) + ';text-anchor:middle');
  }
  function defs() {
    return '<defs>' + ['--a', '--b', '--err', '--ok', '--mute'].map(function (c) {
      return '<marker id="m' + c.slice(2) + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
        '<path d="M0,0 L10,5 L0,10 z" style="fill:var(' + c + ')"/></marker>';
    }).join('') + '</defs>';
  }

  function render(t) {
    var r = stateAt(t);
    var bg = '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="12" style="fill:var(--bg);stroke:var(--hair)"/>';
    document.getElementById('scene').innerHTML = defs() + bg + draw(r, t).join('');
  }

  // ── 캡처 계약: render-gif.mjs가 이 셋과 body.capture를 확인한다
  window.__total = TOTAL;
  window.__render = render;
  window.__size = [W, H];

  var q = new URLSearchParams(location.search);
  var root = document.documentElement, themeSel = document.getElementById('theme');
  root.dataset.theme = q.get('theme') || 'light';   // 라이트가 기본 (사용자 결정 2026-10-08)
  themeSel.value = root.dataset.theme;
  themeSel.onchange = function () { root.dataset.theme = themeSel.value; };

  if (q.has('capture')) {
    document.body.classList.add('capture');
    render(parseFloat(q.get('t') || '0'));
    return;
  }

  var scrub = document.getElementById('scrub'), clock = document.getElementById('clock'), btn = document.getElementById('play');
  scrub.max = TOTAL.toFixed(2);
  var playing = true, t = 0, last = null;
  btn.onclick = function () { playing = !playing; btn.textContent = playing ? '일시정지' : '재생'; last = null; };
  scrub.oninput = function () { t = parseFloat(scrub.value); render(t); clock.textContent = t.toFixed(1) + 's'; };
  function tick(now) {
    if (playing) {
      if (last != null) t = (t + (now - last) / 1000) % TOTAL;
      last = now;
      render(t);
      scrub.value = t; clock.textContent = t.toFixed(1) + 's';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
