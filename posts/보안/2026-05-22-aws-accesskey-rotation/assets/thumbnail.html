<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AccessKey 교체 썸네일</title>
<style>
  /* 색은 의존성 주입 썸네일과 같다 — 대표이미지끼리 같은 그림체로 */
  :root {
    --bg: #fafafa; --surface: #ffffff; --hair: #ebebeb; --hair-strong: #a1a1a1;
    --ink: #171717; --ink-body: #4d4d4d; --mute: #707070;
    --err: #c00000; --err-soft: #ffe1e1;
    --ok: #0b6b4b; --ok-soft: #d6f5ea;
  }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  svg { display: block; width: 1600px; height: 1000px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-ligatures: none; }
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1600 1000"></svg>
<script>
// 글 「유출된 AWS AccessKey 무중단 교체하기」의 대표이미지(= og:image). 기본은 b(제목 + 도식), a는 글자 없는 판.
// 도식은 출근길에 받은 알림을 다시 그린 것이다 — 특정 서비스의 화면을 흉내 내지 않고, 키는 전부 가리고 IP는 넣지 않는다.
// 다시 찍기: Chrome --headless=new --force-device-scale-factor=1 --window-size=1600,1000 --screenshot=thumbnail.png 'thumbnail.html?v=b'
var v = new URLSearchParams(location.search).get('v') || 'b';

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function text(x, y, s, style, cls) {
  return '<text x="' + x + '" y="' + y + '"' + (cls ? ' class="' + cls + '"' : '') + ' style="' + style + '">' + esc(s) + '</text>';
}
function rect(x, y, w, h, fill, stroke, sw, rx) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx === undefined ? 20 : rx) + '"' +
    ' style="fill:var(' + fill + ');stroke:var(' + stroke + ');stroke-width:' + sw + '"/>';
}
function pill(cx, cy, s, fill, stroke, col, size, k) {
  var w = s.length * size * (k || 0.95) + size * 1.4, h = size * 1.9;
  return rect(cx - w / 2, cy - h / 2, w, h, fill, stroke, 4, h / 2) +
    text(cx, cy + size * 0.36, s, 'fill:var(' + col + ');font-size:' + size + 'px;font-weight:800;text-anchor:middle');
}

// 도식 — 0,0 ~ 820,584. 위는 알림 카드, 아래는 그 시도가 막힌 이유(키에 S3 권한 하나뿐)
var W = 820, H = 584;
function diagram() {
  var out = [], CH = 420, KX = 48, VX = 300;
  out.push(rect(0, 0, W, CH, '--surface', '--hair-strong', 4, 22));
  out.push('<path d="M2,22 A20,20 0 0 1 22,2 H24 V' + (CH - 2) + ' H22 A20,20 0 0 1 2,' + (CH - 22) + ' Z" style="fill:var(--err)"/>');
  out.push('<circle cx="80" cy="62" r="26" style="fill:var(--err-soft);stroke:var(--err);stroke-width:4"/>');
  out.push(text(80, 75, '!', 'fill:var(--err);font-size:36px;font-weight:800;text-anchor:middle'));
  out.push(text(124, 75, 'IAM 유저 생성 시도', 'fill:var(--ink);font-size:36px;font-weight:800'));
  out.push('<path d="M44,116 H' + (W - 24) + '" style="stroke:var(--hair);stroke-width:3"/>');

  var rows = [
    ['eventName', 'CreateUser', '--ink', 1],
    ['errorCode', 'AccessDenied', '--err', 1],
    ['accessKeyId', 'AKIA••••••••••••', '--ink-body', 0],
    ['userAgent', 'Boto3/1.42.59 …', '--ink-body', 0]
  ];
  rows.forEach(function (r, i) {
    var y = 180 + i * 62;
    if (r[1] === 'AccessDenied') out.push(rect(VX - 14, y - 38, 256, 52, '--err-soft', '--err', 3, 12));
    out.push(text(KX, y, r[0], 'fill:var(--mute);font-size:26px', 'mono'));
    out.push(text(VX, y, r[1], 'fill:var(' + r[2] + ');font-size:30px' + (r[3] ? ';font-weight:700' : ''), 'mono'));
  });

  // 막힌 이유 — 키에 남아 있던 권한은 S3 하나
  var Y = 464;
  out.push(rect(0, Y, W, H - Y, '--ok-soft', '--ok', 4, 20));
  out.push(text(40, Y + 72, '권한', 'fill:var(--ok);font-size:28px;font-weight:600'));
  out.push(pill(190, Y + 60, 'S3 only', '--ok', '--ok', '--surface', 30, 0.62));
  out.push(text(300, Y + 72, '최소 권한이 막았다', 'fill:var(--ok);font-size:34px;font-weight:800'));
  return out.join('');
}
function place(inner, cx, cy, s) {
  return '<g transform="translate(' + cx + ',' + cy + ') scale(' + s + ') translate(' + (-W / 2) + ',' + (-H / 2) + ')">' + inner + '</g>';
}

var out = '<rect width="1600" height="1000" style="fill:var(--bg)"/>';
if (v === 'a') {
  out += place(diagram(), 800, 500, 1.3);
} else {
  out += text(130, 370, '보안 · AWS IAM', 'fill:var(--mute);font-size:36px;font-weight:600');
  out += text(124, 490, '유출된 AccessKey', 'fill:var(--ink);font-size:80px;font-weight:800;letter-spacing:-2px');
  out += text(124, 600, '무중단 교체', 'fill:var(--ink);font-size:80px;font-weight:800;letter-spacing:-2px');
  out += place(diagram(), 1180, 500, 0.7);
}
document.getElementById('s').innerHTML = out;
</script>
</body>
</html>
