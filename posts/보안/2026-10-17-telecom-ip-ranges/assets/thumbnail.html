<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>통신사 IP 대역 썸네일</title>
<style>
  /* 색은 의존성 주입 썸네일과 같다 — 대표이미지끼리 같은 그림체로 */
  :root {
    --bg: #fafafa; --surface: #ffffff; --hair: #ebebeb; --hair-strong: #a1a1a1;
    --ink: #171717; --ink-body: #4d4d4d; --mute: #707070;
    --a: #0057c2; --a-soft: #d3e5ff;
    --b: #945800; --b-soft: #fdebc8;
    --ok: #0b6b4b; --ok-soft: #d6f5ea;
  }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  svg { display: block; width: 1600px; height: 1000px; }
  .term { font-family: "JetBrains Mono", "Jetendard", ui-monospace, Menlo, monospace; font-variant-ligatures: none; }
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1600 1000"></svg>
<script>
// 글 「통신사별 IP 대역」의 대표이미지(= og:image). 기본은 b(제목 + 도식), a는 글자 없는 판.
// 다시 찍기: Chrome --headless=new --force-device-scale-factor=1 --window-size=1600,1000 --screenshot=thumbnail.png 'thumbnail.html?v=b'
var v = new URLSearchParams(location.search).get('v') || 'b';

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function text(x, y, s, style, cls) {
  return '<text x="' + x + '" y="' + y + '"' + (cls ? ' class="' + cls + '"' : '') + ' style="' + style + '">' + esc(s) + '</text>';
}
function rect(x, y, w, h, fill, stroke, sw, rx) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 20) + '"' +
    ' style="fill:var(' + fill + ');stroke:var(' + stroke + ');stroke-width:' + sw + '"/>';
}
// 한 줄을 조각으로 — [문자열, 색, 굵게?]
function line(x, y, size, parts) {
  return '<text x="' + x + '" y="' + y + '" class="term" style="font-size:' + size + 'px;white-space:pre">' +
    parts.map(function (p) {
      return '<tspan style="fill:var(' + p[1] + ')' + (p[2] ? ';font-weight:700' : '') + '">' + esc(p[0]) + '</tspan>';
    }).join('') + '</text>';
}

// 도식 — 0,0 ~ 820,584. KISA whois 결과 세 개. 항목 이름과 값은 실제 응답 그대로(2026-10-17 조회)
var W = 820, H = 584;
var RUNS = [
  { ip: '223.32.0.0', org: '에스케이텔레콤(주)', range: '223.32.0.0 - 223.63.255.255', cidr: '(/11)', col: '--a' },
  { ip: '39.7.0.0', org: '주식회사 케이티', range: '39.4.0.0 - 39.7.255.255', cidr: '(/14)', col: '--ok' },
  { ip: '106.101.0.0', org: '(주)엘지유플러스', range: '106.96.0.0 - 106.103.255.255', cidr: '(/13)', col: '--b' }
];
function diagram() {
  var out = [];
  out.push(rect(0, 0, W, H, '--surface', '--hair-strong', 4, 24));
  out.push('<path d="M4,64 H' + (W - 4) + '" style="stroke:var(--hair);stroke-width:3"/>');
  ['#ff5f57', '#febc2e', '#28c840'].forEach(function (c, i) {
    out.push('<circle cx="' + (40 + i * 34) + '" cy="33" r="10" fill="' + c + '"/>');
  });
  out.push(text(W / 2, 43, 'whois.kisa.or.kr', 'fill:var(--mute);font-size:24px;text-anchor:middle', 'term'));

  var LX = 44, VX = 204, FS = 25;
  RUNS.forEach(function (r, i) {
    var y = 140 + i * 156;
    out.push(line(LX, y, 28, [['$ ', '--mute'], ['whois ', '--ink-body'], [r.ip, r.col, 1]]));
    out.push(line(LX, y + 46, FS, [['기관명', '--mute']]));
    out.push(line(VX, y + 46, FS, [[r.org, r.col, 1]]));
    out.push(line(LX, y + 86, FS, [['IPv4주소', '--mute']]));
    out.push(line(VX, y + 86, FS, [[r.range + ' ', '--ink-body'], [r.cidr, r.col, 1]]));
  });
  return out.join('');
}
function place(inner, cx, cy, s) {
  return '<g class="d" transform="translate(' + cx + ',' + cy + ') scale(' + s + ') translate(' + (-W / 2) + ',' + (-H / 2) + ')">' + inner + '</g>';
}

var out = '<rect width="1600" height="1000" style="fill:var(--bg)"/>';
if (v === 'a') {
  out += place(diagram(), 800, 500, 1.3);
} else {
  out += text(130, 350, '보안 · 네트워크', 'fill:var(--mute);font-size:36px;font-weight:600');
  out += text(124, 470, '통신사별', 'fill:var(--ink);font-size:96px;font-weight:800;letter-spacing:-2px');
  out += text(124, 590, 'IP 대역', 'fill:var(--ink);font-size:96px;font-weight:800;letter-spacing:-2px');
  out += text(130, 680, 'SK텔레콤 · KT · LG U+', 'fill:var(--ink-body);font-size:44px;font-weight:700');
  out += place(diagram(), 1120, 500, 0.8);
}
document.getElementById('s').innerHTML = out;
</script>
</body>
</html>
