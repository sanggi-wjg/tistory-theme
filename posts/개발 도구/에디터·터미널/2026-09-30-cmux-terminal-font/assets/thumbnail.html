<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>cmux 폰트 썸네일</title>
<style>
  /* 색은 의존성 주입 썸네일과 같다 — 대표이미지끼리 같은 그림체로 */
  :root {
    --bg: #fafafa; --surface: #ffffff; --hair: #ebebeb; --hair-strong: #a1a1a1;
    --ink: #171717; --ink-body: #4d4d4d; --mute: #707070;
    --a: #0057c2; --a-soft: #d3e5ff;
    --b: #945800; --b-soft: #fdebc8;
  }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  svg { display: block; width: 1600px; height: 1000px; }
  /* 글의 설정 그대로 — 영문은 JetBrains Mono, 없는 글자(한글)는 Jetendard로 넘어간다. 두 폰트가 설치돼 있어야 한다 */
  .term { font-family: "JetBrains Mono", "Jetendard", monospace; font-variant-ligatures: none; }
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1600 1000"></svg>
<script>
// 글 「cmux 터미널 폰트 설정 방법」의 대표이미지(= og:image). 기본은 b(제목 + 도식), a는 글자 없는 판.
// 다시 찍기: Chrome --headless=new --force-device-scale-factor=1 --window-size=1600,1000 --screenshot=thumbnail.png 'thumbnail.html?v=b'
var v = new URLSearchParams(location.search).get('v') || 'b';

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function text(x, y, s, style, cls) {
  return '<text x="' + x + '" y="' + y + '"' + (cls ? ' class="' + cls + '"' : '') + ' style="' + style + '">' + esc(s) + '</text>';
}
function rect(x, y, w, h, fill, stroke, sw, rx) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 20) + '"' +
    ' style="fill:var(' + fill + ');stroke:var(' + stroke + ');stroke-width:' + sw + '"/>';
}
// 한 줄을 조각으로 — [문자열, 색, 굵게?]
function line(x, y, size, parts) {
  return '<text x="' + x + '" y="' + y + '" class="term" style="font-size:' + size + 'px;white-space:pre">' +
    parts.map(function (p) {
      return '<tspan' + (p[3] ? ' data-run="' + p[3] + '"' : '') + ' style="fill:var(' + p[1] + ')' + (p[2] ? ';font-weight:700' : '') + '">' + esc(p[0]) + '</tspan>';
    }).join('') + '</text>';
}

// 도식 — 0,0 ~ 820,600. 설정 파일 위, 그 설정으로 그린 한 줄 아래
var W = 820, H = 584;
function diagram() {
  var out = [];
  out.push(rect(0, 0, W, H, '--surface', '--hair-strong', 4, 24));
  out.push('<path d="M4,64 H' + (W - 4) + '" style="stroke:var(--hair);stroke-width:3"/>');
  ['#ff5f57', '#febc2e', '#28c840'].forEach(function (c, i) {
    out.push('<circle cx="' + (40 + i * 34) + '" cy="33" r="10" fill="' + c + '"/>');
  });
  out.push(text(W / 2, 43, '~/.config/ghostty/config', 'fill:var(--mute);font-size:24px;text-anchor:middle', 'term'));

  out.push(line(48, 128, 28, [['# 영문 / 코드', '--mute']]));
  out.push(line(48, 172, 28, [['font-family = ', '--ink-body'], ['JetBrains Mono', '--a', 1]]));
  out.push(line(48, 228, 28, [['# 한글 fallback', '--mute']]));
  out.push(line(48, 272, 28, [['font-family = ', '--ink-body'], ['Jetendard', '--b', 1]]));

  // 그 설정으로 그린 한 줄 — 영문은 첫 폰트, 한글은 다음 폰트
  out.push(rect(28, 320, W - 56, 236, '--bg', '--hair', 3, 16));
  out.push(line(64, 420, 40, [
    ['$ ', '--mute'], ['git commit -m', '--a', 0, 'a'], [' "', '--a'], ['폰트', '--b', 1, 'b'], [' ', '--ink'], ['설정', '--b', 1, 'b'], ['"', '--a']
  ]));
  return out.join('');
}
function place(inner, cx, cy, s) {
  return '<g class="d" transform="translate(' + cx + ',' + cy + ') scale(' + s + ') translate(' + (-W / 2) + ',' + (-H / 2) + ')">' + inner + '</g>';
}

// 밑줄과 폰트 이름 — 글자 폭은 폰트가 정하니 그린 뒤에 잰다
function underline(g) {
  var bx = function (k) { return Array.prototype.map.call(g.querySelectorAll('[data-run="' + k + '"]'), function (e) { return e.getBBox(); }); };
  var add = [], Y = 450;
  function bar(x0, x1, col) {
    add.push('<path d="M' + (x0 + 4) + ',' + Y + ' H' + (x1 - 4) + '" stroke-linecap="round" style="stroke:var(' + col + ');stroke-width:6"/>');
  }
  var a = bx('a')[0], hb = bx('b'), h0 = hb[0].x, h1 = hb[hb.length - 1].x + hb[hb.length - 1].width;
  bar(a.x, a.x + a.width, '--a');
  bar(h0, h1, '--b');
  add.push(text(a.x + a.width / 2, Y + 56, 'JetBrains Mono', 'fill:var(--a);font-size:30px;font-weight:700;text-anchor:middle', 'term'));
  add.push(text((h0 + h1) / 2, Y + 56, 'Jetendard', 'fill:var(--b);font-size:30px;font-weight:700;text-anchor:middle', 'term'));
  g.insertAdjacentHTML('beforeend', add.join(''));
}

var out = '<rect width="1600" height="1000" style="fill:var(--bg)"/>';
if (v === 'a') {
  out += place(diagram(), 800, 500, 1.3);
} else {
  out += text(130, 370, '개발 도구', 'fill:var(--mute);font-size:36px;font-weight:600');
  out += text(124, 490, 'cmux 터미널', 'fill:var(--ink);font-size:96px;font-weight:800;letter-spacing:-2px');
  out += text(124, 610, '폰트 설정', 'fill:var(--ink);font-size:96px;font-weight:800;letter-spacing:-2px');
  out += place(diagram(), 1120, 500, 0.8);
}
document.getElementById('s').innerHTML = out;
underline(document.querySelector('.d'));
</script>
</body>
</html>
