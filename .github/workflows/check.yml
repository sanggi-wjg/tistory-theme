# `npm run check`를 깨끗한 러너에서 한 번 더 돌린다.
#
# 이 잡은 CLAUDE.md 「작업 방식」 4번(npm run check)의 보험이지 6번(/pr-review-gate)의 대체가 아니다.
# 린트는 "규칙이 있는가"만 본다 — 규칙이 이 변경의 실제 조건을 재현하는지는 리뷰가 본다.
#
# 러너에는 로컬 상태(.claude/.pr-review-ok · dist/ · _preview/ · node_modules/)가 없다.
# 그 부재 자체가 검사다 — 다섯째 위조 신호(test:hooks가 진짜 마커를 읽은 것)는 정확히 로컬 상태 때문이었다.
#
# 잡 이름 `check`는 main 브랜치 보호 규칙의 required status check 이름이다. 바꾸면 보호 규칙도 같이 바꾼다.

name: check

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR에 커밋이 연달아 올라오면 앞선 실행은 취소한다.
# main 푸시는 취소하지 않는다 — 연속 머지 때 앞 커밋이 검사 없이 지나가면 안 된다.
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 버전은 로컬 개발 환경과 맞춘다 (2026-08-27 기준 node 26 · python 3.14).
      # 로컬에서 통과한 것이 여기서 다른 이유로 깨지면 안 된다.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - run: npm ci

      # 빌드 → 린트 → 테스트 7종 → 프리뷰 렌더. package.json의 check 스크립트가 정본이다.
      - run: npm run check

      # 프리뷰 HTML을 남겨 PR에서 렌더 결과를 받아볼 수 있게 한다 (실패해도 남긴다)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-${{ github.sha }}
          path: _preview/
          if-no-files-found: ignore
          overwrite: true          # 잡 재실행 때 같은 이름으로 다시 올린다 — v4는 기본이 충돌 실패다
          retention-days: 7
